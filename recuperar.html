<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - HMV</title>
    <style>
        :root { --hmv-blue: #004b87; --hmv-yellow: #FFD700; --bg-body: #555555; --bg-box: #ffffff; --text-color: #333333; --input-bg: #ffffff; --input-border: #ccc; }
        body.dark-mode { --bg-body: #1a1a1a; --bg-box: #2c2c2c; --text-color: #f1f1f1; --input-bg: #444444; --input-border: #555555; }
        body { font-family: Arial, sans-serif; background-color: var(--bg-body); margin: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; transition: 0.3s; }
        .logo-hmv { max-width: 250px; margin-bottom: 20px; }
        .login-box { background-color: var(--bg-box); width: 90%; max-width: 400px; padding: 30px; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; color: var(--text-color); }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 5px; color: var(--text-color); }
        .input-group input { width: 100%; padding: 10px; border: 1px solid var(--input-border); border-radius: 5px; box-sizing: border-box; background: var(--input-bg); color: var(--text-color); }
        .btn-principal { background-color: var(--hmv-blue); color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .btn-principal:hover { background-color: #003666; }
        .link-amarillo { display: inline-block; color: var(--hmv-yellow); font-weight: bold; text-decoration: none; margin-top: 20px; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
        .btn-tema { position: absolute; top: 20px; right: 20px; background-color: var(--bg-box); color: var(--text-color); border: 2px solid var(--hmv-blue); padding: 8px 12px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        .titulo-seccion { color: var(--hmv-blue); margin-bottom: 20px; font-size: 18px; border-bottom: 2px solid var(--hmv-yellow); display: inline-block; }
    </style>
</head>
<body id="body-main">

<button class="btn-tema" onclick="toggleTheme()">🌓 Tema</button>
<img src="https://camacol.co/sites/default/files/2026-05/LOG-HMV_HMV_Color.webp" class="logo-hmv">

<div class="login-box">
    <h2 class="titulo-seccion">Recuperar Contraseña</h2>
    
    <div id="rec-paso-1">
        <p style="font-size: 12px; margin-bottom: 15px;">Ingrese su documento para validar su pregunta de seguridad.</p>
        <div class="input-group">
            <label>Número de Documento</label>
            <input type="number" id="rec-documento">
        </div>
        <button id="btn-buscar-doc" class="btn-principal">Buscar</button>
    </div>

    <div id="rec-paso-2" style="display: none;">
        <p id="mostrar-pregunta" style="font-weight: bold; font-size: 14px; color: var(--hmv-blue); margin-bottom: 15px;"></p>
        <div class="input-group">
            <label>Su Respuesta</label>
            <input type="text" id="rec-respuesta">
        </div>
        <div class="input-group">
            <label>Nueva Contraseña</label>
            <input type="password" id="rec-nueva-password">
        </div>
        <button id="btn-cambiar-pass" class="btn-principal">Cambiar Contraseña</button>
    </div>
</div>

<a href="index.html" class="link-amarillo">Volver al inicio de sesión</a>

<script>
    if (localStorage.getItem('hmv_theme') === 'dark') document.getElementById('body-main').classList.add('dark-mode');
    function toggleTheme() {
        const body = document.getElementById('body-main');
        body.classList.toggle('dark-mode');
        localStorage.setItem('hmv_theme', body.classList.contains('dark-mode') ? 'dark' : 'light');
    }
</script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = { apiKey: "AIzaSyD-VxIU8Ngayhb2-Tq5dcY42AG6Spp6f1g", authDomain: "sst-hmv.firebaseapp.com", databaseURL: "https://sst-hmv-default-rtdb.firebaseio.com", projectId: "sst-hmv", storageBucket: "sst-hmv.firebasestorage.app", messagingSenderId: "224287433604", appId: "1:224287433604:web:387a81c078875b7fb5b3d1" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let usuarioEnRecuperacion = null;

    document.getElementById('btn-buscar-doc').onclick = async function() {
        const doc = document.getElementById('rec-documento').value.trim();
        if(!doc) return alert("Ingrese un número de documento.");
        this.innerText = "Buscando...";
        try {
            const snapshot = await get(ref(db, `usuarios/${doc}`));
            if (snapshot.exists()) {
                usuarioEnRecuperacion = snapshot.val();
                document.getElementById('mostrar-pregunta').innerText = usuarioEnRecuperacion.preguntaSeguridad;
                document.getElementById('rec-paso-1').style.display = 'none';
                document.getElementById('rec-paso-2').style.display = 'block';
            } else alert("❌ No existe un usuario con este documento.");
        } catch (error) { alert("Error: " + error.message); }
        this.innerText = "Buscar";
    };

    document.getElementById('btn-cambiar-pass').onclick = async function() {
        const respuestaIngresada = document.getElementById('rec-respuesta').value.trim().toLowerCase();
        const nuevaPass = document.getElementById('rec-nueva-password').value.trim();
        if(!respuestaIngresada || !nuevaPass) return alert("Ingrese la respuesta y nueva contraseña.");
        if (respuestaIngresada === usuarioEnRecuperacion.respuestaSeguridad) {
            this.innerText = "Cambiando...";
            try {
                await update(ref(db, `usuarios/${usuarioEnRecuperacion.documento}`), { password: nuevaPass });
                alert("✅ Contraseña actualizada correctamente.");
                window.location.href = 'index.html';
            } catch (error) { alert("Error: " + error.message); }
        } else alert("❌ Respuesta incorrecta.");
    };
</script>
</body>
</html>
