<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - HMV Ingenieros</title>
    <style>
        :root {
            --hmv-blue: #004b87;
            --hmv-yellow: #FFD700;
            --bg-body: #555555;
            --bg-box: #ffffff;
            --text-color: #333333;
            --input-bg: #ffffff;
            --input-border: #ccc;
        }

        body.dark-mode {
            --bg-body: #1a1a1a;
            --bg-box: #2c2c2c;
            --text-color: #f1f1f1;
            --input-bg: #444444;
            --input-border: #555555;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: var(--bg-body);
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s;
        }

        .logo-hmv {
            max-width: 300px;
            width: 80%;
            height: auto;
            margin-bottom: 20px;
        }

        .login-box {
            background-color: var(--bg-box);
            width: 90%;
            max-width: 350px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 5px;
            color: var(--text-color);
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--input-border);
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
            font-family: inherit;
            background-color: var(--input-bg);
            color: var(--text-color);
        }

        .btn-principal {
            background-color: var(--hmv-blue);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 5px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: background 0.3s;
        }
        .btn-principal:hover { background-color: #003666; }

        .link-amarillo {
            display: inline-block;
            color: var(--hmv-yellow);
            font-weight: bold;
            text-decoration: none;
            margin-top: 20px;
            cursor: pointer;
            font-size: 15px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        .link-amarillo:hover { text-decoration: underline; color: #e6c200; }

        .btn-tema {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: var(--bg-box);
            color: var(--text-color);
            border: 2px solid var(--hmv-blue);
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
    </style>
    <script>
        // Aplicar el tema guardado apenas carga la página
        const savedTheme = localStorage.getItem('hmv_theme') || 'light';
        if (savedTheme === 'dark') document.documentElement.classList.add('dark-mode');
    </script>
</head>
<body id="body-main">

<button class="btn-tema" onclick="toggleTheme()">🌓 Tema</button>

<img src="https://camacol.co/sites/default/files/2026-05/LOG-HMV_HMV_Color.webp" alt="Logo HMV" class="logo-hmv">

<div class="login-box">
    <div class="input-group">
        <label>Usuario</label>
        <input type="text" id="log-usuario" placeholder="Ingresa tu usuario">
    </div>
    <div class="input-group">
        <label>Contraseña</label>
        <input type="password" id="log-password" placeholder="Ingresa tu contraseña">
    </div>
    <button id="btn-ingresar" class="btn-principal">Ingresar</button>
</div>

<!-- Enlace por fuera del recuadro -->
<a href="recuperar.html" class="link-amarillo">¿Olvidó su contraseña?</a>

<script>
    if (localStorage.getItem('hmv_theme') === 'dark') document.getElementById('body-main').classList.add('dark-mode');
    function toggleTheme() {
        const body = document.getElementById('body-main');
        body.classList.toggle('dark-mode');
        localStorage.setItem('hmv_theme', body.classList.contains('dark-mode') ? 'dark' : 'light');
    }
</script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD-VxIU8Ngayhb2-Tq5dcY42AG6Spp6f1g",
        authDomain: "sst-hmv.firebaseapp.com",
        databaseURL: "https://sst-hmv-default-rtdb.firebaseio.com",
        projectId: "sst-hmv",
        storageBucket: "sst-hmv.firebasestorage.app",
        messagingSenderId: "224287433604",
        appId: "1:224287433604:web:387a81c078875b7fb5b3d1"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    document.getElementById('btn-ingresar').onclick = async function() {
        const usuarioInput = document.getElementById('log-usuario').value.trim();
        const passwordInput = document.getElementById('log-password').value.trim();

        if(!usuarioInput || !passwordInput) return alert("Ingrese su usuario y contraseña.");

        const originalText = this.innerText;
        this.innerText = "Verificando...";

        try {
            const snapshot = await get(ref(db, 'usuarios'));
            if (snapshot.exists()) {
                const usuarios = snapshot.val();
                let usuarioValido = null;
                for (const doc in usuarios) {
                    if (usuarios[doc].usuario === usuarioInput && usuarios[doc].password === passwordInput) {
                        usuarioValido = usuarios[doc];
                        break;
                    }
                }
                if (usuarioValido) {
                    localStorage.setItem('hmv_user_role', usuarioValido.rol);
                    localStorage.setItem('hmv_user_name', usuarioValido.nombre);
                    window.location.href = 'panel.html';
                } else {
                    alert("❌ Usuario o contraseña incorrectos.");
                }
            } else {
                alert("No hay usuarios registrados en el sistema.");
            }
        } catch (error) { alert("Error al conectar: " + error.message); }
        this.innerText = originalText;
    };
</script>
</body>
</html>
