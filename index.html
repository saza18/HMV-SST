<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- PRECARGA DEL LOGO PARA OPTIMIZAR LA VELOCIDAD -->
    <link rel="preload" href="https://camacol.co/sites/default/files/2026-05/LOG-HMV_HMV_Color.webp" as="image">
    <title>Acceso - HMV Ingenieros</title>
    <style>
        :root {
            --bg-body: #d6e0ea; 
            --bg-box: #ffffff;
            --text-color: #1f2937;
            --text-muted: #6b7280;
            --input-bg: #f4f7fb;
            --input-border: #e5e7eb;
            --hmv-blue: #004b87;
            --hmv-blue-hover: #003666;
            --hmv-yellow: #FFD700;
            --hmv-yellow-hover: #e6c200;
        }

        body.dark-mode {
            --bg-body: #0c101b;
            --bg-box: #1f293d;
            --text-color: #ffffff;
            --text-muted: #889bb0;
            --input-bg: #141b2d;
            --input-border: #2a3b5c;
        }

        /* ELIMINA EL RESPLANDOR AZUL EN TODOS LOS ELEMENTOS TÁCTILES */
        * {
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: var(--bg-body);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100dvh; 
            transition: background-color 0.3s;
            position: relative;
            overscroll-behavior-y: auto; 
        }

        /* TRUCO CSS: Centra los elementos verticalmente si caben */
        body::before, body::after {
            content: '';
            flex: 1;
            min-height: 20px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* MENÚ HAMBURGUESA Y DESPLEGABLE EN LA ESQUINA */
        .menu-container {
            position: absolute;
            top: 20px;
            right: 25px;
            z-index: 1000;
        }

        .btn-hamburguesa {
            background: transparent;
            border: none;
            font-size: 28px;
            color: var(--text-color);
            cursor: pointer;
            padding: 5px;
            transition: color 0.3s, transform 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
        }

        .btn-hamburguesa:hover {
            color: var(--hmv-blue);
        }

        .btn-hamburguesa:active {
            transform: scale(0.85); 
        }

        .dropdown-menu {
            visibility: hidden;
            opacity: 0;
            transform: translateY(-10px);
            position: absolute;
            right: 100%;
            top: 0;
            margin-right: 15px;
            background-color: var(--bg-box);
            min-width: 160px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            border-radius: 12px;
            border: 1px solid var(--input-border);
            overflow: hidden;
            transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s;
            will-change: transform, opacity;
        }

        .dropdown-menu.show {
            visibility: visible;
            opacity: 1;
            transform: translateY(0);
        }

        .dropdown-menu button {
            width: 100%;
            padding: 12px 16px;
            border: none;
            background: none;
            text-align: left;
            color: var(--text-color);
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .dropdown-menu button:hover {
            background-color: var(--input-bg);
        }

        /* LOGO */
        .logo-hmv {
            max-width: 300px;
            width: 80%;
            height: auto;
            margin-bottom: 25px;
            animation: fadeIn 0.4s ease-out forwards;
        }

        /* CAJA PRINCIPAL */
        .login-box {
            background-color: var(--bg-box);
            width: 90%;
            max-width: 350px;
            padding: 35px 30px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
            opacity: 0;
            animation: fadeIn 0.4s ease-out 0.1s forwards;
            will-change: transform, opacity;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--text-muted);
            text-transform: uppercase;
            padding-left: 15px;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 14px 20px;
            border: 1px solid var(--input-border);
            border-radius: 50px; 
            box-sizing: border-box;
            font-size: 14px;
            font-family: inherit;
            background-color: var(--input-bg);
            color: var(--text-color);
            outline: none;
            transition: border-color 0.3s;
        }
        
        .input-group input:focus, .input-group select:focus {
            border-color: var(--hmv-blue);
        }

        /* BOTÓN TIPO PÍLDORA */
        .btn-principal {
            background-color: var(--hmv-blue);
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 50px; 
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
            transition: background-color 0.3s, transform 0.15s ease;
            outline: none;
        }
        
        .btn-principal:hover { background-color: var(--hmv-blue-hover); }
        .btn-principal:active { transform: scale(0.95); } 

        /* ENLACE */
        .link-amarillo {
            display: inline-block;
            color: var(--hmv-yellow);
            font-weight: bold;
            text-decoration: none;
            margin-top: 25px;
            cursor: pointer;
            font-size: 14px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            transition: color 0.3s, transform 0.15s ease;
            outline: none;
            opacity: 0;
            animation: fadeIn 0.4s ease-out 0.2s forwards;
        }
        .link-amarillo:hover { color: var(--hmv-yellow-hover); }
        .link-amarillo:active { transform: scale(0.90); } 

        /* MODAL DE SEGURIDAD (Nuevo) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 4000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(3px);
            opacity: 0;
            animation: fadeIn 0.3s forwards;
        }

        .modal-content {
            background-color: var(--bg-box);
            padding: 35px 30px;
            border-radius: 24px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            border: 1px solid var(--input-border);
        }

        /* AJUSTES ESPECÍFICOS PARA CELULAR */
        @media (max-width: 768px) {
            .menu-container {
                top: 20px;
                right: 15px;
            }
            .dropdown-menu {
                top: 0;
                right: 40px; 
            }
            .logo-hmv {
                max-width: 250px;
                margin-top: 20px; 
                margin-bottom: 20px;
            }
            .login-box {
                width: 85%;
                max-width: 300px;
                border-radius: 36px;
                padding: 30px 25px;
            }
            .modal-content {
                width: 85%;
                border-radius: 36px;
                padding: 30px 25px;
            }
        }

    </style>
</head>
<body id="body-main">

<!-- MENÚ ELEGANTE -->
<div class="menu-container">
    <button class="btn-hamburguesa" onclick="toggleMenu()" title="Menú">☰</button>
    <div class="dropdown-menu" id="login-menu">
        <button onclick="toggleTheme()" id="btn-theme-text">🌓 Tema</button>
        <button onclick="toggleLanguage()" id="btn-lang-text">🌐 English</button>
    </div>
</div>

<img src="https://camacol.co/sites/default/files/2026-05/LOG-HMV_HMV_Color.webp" alt="Logo HMV" class="logo-hmv">

<div class="login-box">
    <div class="input-group">
        <label id="lbl-user">Usuario</label>
        <input type="text" id="log-usuario" placeholder="Ingresa tu usuario">
    </div>
    <div class="input-group">
        <label id="lbl-pass">Contraseña</label>
        <input type="password" id="log-password" placeholder="Ingresa tu contraseña">
    </div>
    <button id="btn-ingresar" class="btn-principal">Ingresar</button>
</div>

<a href="recuperar.html" class="link-amarillo" id="link-forgot">¿Olvidó su contraseña?</a>

<!-- MODAL ACTUALIZAR SEGURIDAD -->
<div class="modal-overlay" id="modal-seguridad">
    <div class="modal-content">
        <h3 id="mod-title" style="color: var(--text-color); margin-top: 0; font-size: 20px; text-align: center;">Configuración Inicial</h3>
        <p id="mod-desc" style="font-size: 13px; color: var(--text-muted); text-align: center; margin-bottom: 20px; line-height: 1.5;">Por seguridad, debe configurar una pregunta y respuesta personal para recuperar su contraseña en el futuro.</p>
        
        <div class="input-group">
            <label id="lbl-q">Seleccione una pregunta</label>
            <select id="act-pregunta">
                <option value="mascota">¿Cuál es el nombre de tu primera mascota?</option>
                <option value="ciudad">¿En qué ciudad naciste?</option>
                <option value="madre">¿Cuál es el segundo nombre de tu madre?</option>
                <option value="colegio">¿Cuál fue tu primer colegio?</option>
            </select>
        </div>
        <div class="input-group">
            <label id="lbl-a">Su nueva respuesta</label>
            <input type="text" id="act-respuesta" placeholder="Escriba su respuesta secreta">
        </div>
        
        <button id="btn-guardar-seguridad" class="btn-principal" style="margin-top: 5px;">Guardar y Continuar</button>
    </div>
</div>

<script>
    // DICCIONARIO DE TRADUCCIÓN (Actualizado con textos del modal de seguridad)
    const traducciones = {
        es: {
            userLabel: "USUARIO",
            userPlaceholder: "Ingresa tu usuario",
            passLabel: "CONTRASEÑA",
            passPlaceholder: "Ingresa tu contraseña",
            btnLogin: "Ingresar",
            btnForgot: "¿Olvidó su contraseña?",
            langText: "🌐 English",
            alertEmpty: "Ingrese su usuario y contraseña.",
            alertVerifying: "Verificando...",
            alertBlocked: "❌ Su cuenta ha sido bloqueada por el Administrador.",
            alertError: "❌ Usuario o contraseña incorrectos.",
            alertNoUsers: "No hay usuarios registrados en el sistema.",
            themeDark: "🌓 Tema Oscuro",
            themeLight: "☀️ Tema Claro",
            modTitle: "Configuración Inicial",
            modDesc: "Por seguridad, debe configurar una pregunta y respuesta personal para recuperar su contraseña en el futuro.",
            lblQ: "SELECCIONE UNA PREGUNTA",
            lblA: "SU NUEVA RESPUESTA",
            actPlaceholder: "Escriba su respuesta secreta",
            btnSaveSec: "Guardar y Continuar",
            alertInvalidA: "❌ Ingrese una respuesta válida y diferente a la de por defecto.",
            alertSaving: "Guardando..."
        },
        en: {
            userLabel: "USERNAME",
            userPlaceholder: "Enter your username",
            passLabel: "PASSWORD",
            passPlaceholder: "Enter your password",
            btnLogin: "Login",
            btnForgot: "Forgot your password?",
            langText: "🌐 Español",
            alertEmpty: "Please enter your username and password.",
            alertVerifying: "Verifying...",
            alertBlocked: "❌ Your account has been blocked by the Administrator.",
            alertError: "❌ Invalid username or password.",
            alertNoUsers: "No users registered in the system.",
            themeDark: "🌓 Dark Theme",
            themeLight: "☀️ Light Theme",
            modTitle: "Initial Setup",
            modDesc: "For security reasons, you must set up a personal question and answer to recover your password in the future.",
            lblQ: "SELECT A QUESTION",
            lblA: "YOUR NEW ANSWER",
            actPlaceholder: "Type your secret answer",
            btnSaveSec: "Save and Continue",
            alertInvalidA: "❌ Please enter a valid answer different from the default.",
            alertSaving: "Saving..."
        }
    };

    let idiomaActual = localStorage.getItem('hmv_lang') || 'es';

    function actualizarTextos() {
        const t = traducciones[idiomaActual];
        // Textos del Login principal
        document.getElementById('lbl-user').innerText = t.userLabel;
        document.getElementById('log-usuario').placeholder = t.userPlaceholder;
        document.getElementById('lbl-pass').innerText = t.passLabel;
        document.getElementById('log-password').placeholder = t.passPlaceholder;
        document.getElementById('btn-ingresar').innerText = t.btnLogin;
        document.getElementById('link-forgot').innerText = t.btnForgot;
        document.getElementById('btn-lang-text').innerText = t.langText;
        
        // Textos del Modal de Seguridad
        document.getElementById('mod-title').innerText = t.modTitle;
        document.getElementById('mod-desc').innerText = t.modDesc;
        document.getElementById('lbl-q').innerText = t.lblQ;
        document.getElementById('lbl-a').innerText = t.lblA;
        document.getElementById('act-respuesta').placeholder = t.actPlaceholder;
        document.getElementById('btn-guardar-seguridad').innerText = t.btnSaveSec;

        actualizarTextoTema();
    }

    function toggleLanguage() {
        idiomaActual = (idiomaActual === 'es') ? 'en' : 'es';
        localStorage.setItem('hmv_lang', idiomaActual);
        actualizarTextos();
        document.getElementById('login-menu').classList.remove('show');
    }

    const savedTheme = localStorage.getItem('hmv_theme') || 'light';
    if (savedTheme === 'dark') document.documentElement.classList.add('dark-mode');

    if (localStorage.getItem('hmv_theme') === 'dark') {
        document.getElementById('body-main').classList.add('dark-mode');
    }

    function actualizarTextoTema() {
        const isDark = document.getElementById('body-main').classList.contains('dark-mode');
        const t = traducciones[idiomaActual];
        document.getElementById('btn-theme-text').innerText = isDark ? t.themeLight : t.themeDark;
    }

    function toggleTheme() {
        const body = document.getElementById('body-main');
        body.classList.toggle('dark-mode');
        localStorage.setItem('hmv_theme', body.classList.contains('dark-mode') ? 'dark' : 'light');
        actualizarTextoTema();
        document.getElementById('login-menu').classList.remove('show');
    }

    function toggleMenu() {
        const menu = document.getElementById('login-menu');
        menu.classList.toggle('show');
    }

    window.onclick = function(event) {
        if (!event.target.matches('.btn-hamburguesa')) {
            const dropdowns = document.getElementsByClassName("dropdown-menu");
            for (let i = 0; i < dropdowns.length; i++) {
                if (dropdowns[i].classList.contains('show')) {
                    dropdowns[i].classList.remove('show');
                }
            }
        }
    }

    actualizarTextos();
</script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD-VxIU8Ngayhb2-Tq5dcY42AG6Spp6f1g",
        authDomain: "sst-hmv.firebaseapp.com",
        databaseURL: "https://sst-hmv-default-rtdb.firebaseio.com",
        projectId: "sst-hmv",
        storageBucket: "sst-hmv.firebasestorage.app",
        messagingSenderId: "224287433604",
        appId: "1:224287433604:web:387a81c078875b7fb5b3d1"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let usuarioPendiente = null; // Variable para almacenar temporalmente al usuario que debe actualizar datos

    // FUNCIÓN PARA HACER LA REDIRECCIÓN OFICIAL
    function procederLogin(user) {
        localStorage.setItem('hmv_user_role', user.rol);
        localStorage.setItem('hmv_user_name', user.nombre);
        
        if (user.rol === 'Administrador Root') {
            window.location.href = 'panel_root.html';
        } else {
            window.location.href = 'panel.html';
        }
    }

    document.getElementById('btn-ingresar').onclick = async function() {
        const usuarioInput = document.getElementById('log-usuario').value.trim();
        const passwordInput = document.getElementById('log-password').value.trim();
        const t = traducciones[idiomaActual]; 

        if(!usuarioInput || !passwordInput) return alert(t.alertEmpty);

        const originalText = this.innerText;
        this.innerText = t.alertVerifying;

        try {
            const snapshot = await get(ref(db, 'usuarios'));
            if (snapshot.exists()) {
                const usuarios = snapshot.val();
                let usuarioValido = null;
                
                for (const doc in usuarios) {
                    if (usuarios[doc].usuario === usuarioInput && usuarios[doc].password === passwordInput) {
                        usuarioValido = usuarios[doc];
                        break;
                    }
                }
                
                if (usuarioValido) {
                    if(usuarioValido.bloqueado) {
                        alert(t.alertBlocked);
                        this.innerText = originalText;
                        return;
                    }

                    // INTERCEPTOR DE SEGURIDAD: Verifica si la respuesta secreta sigue siendo la que da el Root ("admin")
                    if (usuarioValido.respuestaSeguridad === 'admin') {
                        usuarioPendiente = usuarioValido;
                        document.getElementById('modal-seguridad').style.display = 'flex';
                        this.innerText = originalText;
                        return; // Se detiene aquí, no redirige aún
                    }

                    // Si ya la había cambiado antes, pasa directo.
                    procederLogin(usuarioValido);
                    
                } else {
                    alert(t.alertError);
                }
            } else {
                alert(t.alertNoUsers);
            }
        } catch (error) { alert("Error: " + error.message); }
        this.innerText = originalText;
    };

    // BOTÓN DE GUARDAR EN EL MODAL DE SEGURIDAD
    document.getElementById('btn-guardar-seguridad').onclick = async function() {
        const t = traducciones[idiomaActual];
        const combo = document.getElementById('act-pregunta');
        const pre = combo.options[combo.selectedIndex].text;
        const res = document.getElementById('act-respuesta').value.trim().toLowerCase();

        // Evita que ponga datos vacíos o que vuelva a poner la contraseña root "admin"
        if(!res || res === 'admin') {
            alert(t.alertInvalidA);
            return;
        }

        const originalText = this.innerText;
        this.innerText = t.alertSaving;

        try {
            // Actualiza en Firebase
            await update(ref(db, `usuarios/${usuarioPendiente.documento}`), {
                preguntaSeguridad: pre,
                respuestaSeguridad: res
            });
            
            // Si la guardó correctamente, ahora sí entra al sistema.
            procederLogin(usuarioPendiente);

        } catch (error) {
            alert("Error: " + error.message);
            this.innerText = originalText;
        }
    };
</script>
</body>
</html>
